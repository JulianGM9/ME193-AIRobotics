    accel_noise_floor: 1010.9962726309304
    accel_avg_peak: 2288.9436473803316
paddle:
  smoothing_alpha: 0.3
levels:
  default: beginner
  confirm_hold_seconds: 1.0
  tags:
    0: beginner
    1: intermediate
    2: advanced
    3: expert
  definitions:
    beginner:
      ball_speed: 0.6
      hit_radius: 0.7
      timing_window_ms: 400
      opponent_max_speed: 1.0
      opponent_reaction_delay: 0.35
      opponent_miss_probability: 0.25
      opponent_return_speed_range:
      - 2.1
      - 2.7
      opponent_return_target_spread: 0.5
      opponent_hit_radius: 0.3
    intermediate:
      ball_speed: 0.8
      hit_radius: 0.5
      timing_window_ms: 320
      opponent_max_speed: 1.5
      opponent_reaction_delay: 0.25
      opponent_miss_probability: 0.15
      opponent_return_speed_range:
      - 2.8
      - 3.6
      opponent_return_target_spread: 0.6
      opponent_hit_radius: 0.22
    advanced:
      ball_speed: 1.0
      hit_radius: 0.36
      timing_window_ms: 250
      opponent_max_speed: 2.0
      opponent_reaction_delay: 0.15
      opponent_miss_probability: 0.08
      opponent_return_speed_range:
      - 3.5
      - 4.5
      opponent_return_target_spread: 0.7
      opponent_hit_radius: 0.15
    expert:
      ball_speed: 1.3
      hit_radius: 0.24
      timing_window_ms: 180
      opponent_max_speed: 2.8
      opponent_reaction_delay: 0.08
      opponent_miss_probability: 0.03
      opponent_return_speed_range:
      - 4.5
      - 5.9
      opponent_return_target_spread: 0.75
      opponent_hit_radius: 0.1
