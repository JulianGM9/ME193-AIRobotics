mqtt:
  broker: test.mosquitto.org
  port: 1883
  topic: ME193/Rogers/Julian
  qos: 0
  heartbeat_seconds: 5
motor:
  card_color: null
  card_serial: null
swing_detector:
  poll_interval_ms: 15
  refractory_ms: 300
  smoothing_alpha: 0.3
  gravity_ema_alpha: 0.02
  calibration_hold_seconds: 3
  calibration_num_swings: 5
  threshold_fraction: 0.5
  calibration:
    gyro_noise_floor: 141.11012383062663
    gyro_avg_peak: 564.79387461783
    accel_noise_floor: 1010.9962726309304
    accel_avg_peak: 2288.9436473803316
paddle:
  smoothing_alpha: 0.3
levels:
  default: beginner
  confirm_hold_seconds: 1.0
  tags:
    0: beginner
    1: intermediate
    2: advanced
    3: expert
  definitions:
    beginner:
      ball_speed: 0.6
      hit_radius: 0.7
      timing_window_ms: 400
      opponent_max_speed: 1.0
      opponent_reaction_delay: 0.35
      opponent_miss_probability: 0.25
      opponent_return_speed_range:
      - 2.1
      - 2.7
      opponent_return_target_spread: 0.5
      opponent_hit_radius: 0.3
    intermediate:
      ball_speed: 0.8
      hit_radius: 0.5
      timing_window_ms: 320
      opponent_max_speed: 1.5
      opponent_reaction_delay: 0.25
      opponent_miss_probability: 0.15
      opponent_return_speed_range:
      - 2.8
      - 3.6
      opponent_return_target_spread: 0.6
      opponent_hit_radius: 0.22
    advanced:
      ball_speed: 1.0
      hit_radius: 0.36
      timing_window_ms: 250
      opponent_max_speed: 2.0
      opponent_reaction_delay: 0.15
      opponent_miss_probability: 0.08
      opponent_return_speed_range:
      - 3.5
      - 4.5
      opponent_return_target_spread: 0.7
      opponent_hit_radius: 0.15
    expert:
      ball_speed: 1.3
      hit_radius: 0.24
      timing_window_ms: 180
      opponent_max_speed: 2.8
      opponent_reaction_delay: 0.08
      opponent_miss_probability: 0.03
      opponent_return_speed_range:
      - 4.5
      - 5.9
      opponent_return_target_spread: 0.75
      opponent_hit_radius: 0.1
    # Secret level: not in `tags` above, so it's unreachable via AprilTag -
    # only reachable via the P key on STATE_LEVEL_SELECT (a placeholder
    # unlock condition, see main.py). The opponent here is a QLearningOpponent
    # (game/q_learning.py), not the usual Opponent class, so the
    # opponent_max_speed/reaction_delay/miss_probability fields the other 4
    # levels use don't apply - q_* fields configure the Q-learning side
    # instead, and opponent_return_* still configures its return shot
    # physics the same way as the other levels (reused as-is).
    claude:
      ball_speed: 0.8
      hit_radius: 0.5
      timing_window_ms: 320
      q_num_ball_buckets: 9
      q_num_paddle_buckets: 9
      # Higher than a "default" Q-learning setup would usually start with -
      # with a small 9x9 table and no discount term, a higher learning
      # rate converges each cell faster (less to average over), and
      # exploration needs to be high enough to actually visit all 81
      # cells in a reasonable number of rallies. Tune live with the
      # in-game sliders once it's trained.
      q_learning_rate: 0.5
      q_exploration_rate: 0.3
      q_hit_radius: 0.3
      opponent_return_speed_range:
      - 2.8
      - 3.6
      opponent_return_target_spread: 0.6
physics:
  table_length: 2.74
  table_width: 1.525
  net_height: 0.1525
  gravity: -9.8
  restitution: 0.85
render:
  screen_width: 960
  screen_height: 600
  # Chunk size (in real pixels) for the retro pixelation filter applied to
  # the whole screen every frame - higher is blockier/more retro, lower is
  # closer to the original crisp rendering. Tune to taste.
  pixel_scale: 2
  camera_height: 1.0
  camera_back_offset: 1.8
  focal_length: 700
  near_clip: 0.05
  pip_width: 200
  pip_height: 150
  tracking_view_width: 700
  tracking_view_height: 525
player:
  reach_scale: 0.6
  base_height: 0.3
